<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Lights Out</title>
  <desc id="description">A five by five violet light board with a glowing yellow cross.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7253a7" />
      <stop offset="0.32" stop-color="#4a3275" />
      <stop offset="1" stop-color="#211735" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8fa" />
      <stop offset="0.48" stop-color="#a5a6ad" />
      <stop offset="1" stop-color="#e7e8eb" />
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e5b9b" />
      <stop offset="1" stop-color="#341c49" />
    </linearGradient>
    <radialGradient id="lamp" cx="48%" cy="38%" r="72%">
      <stop offset="0" stop-color="#fffbd0" />
      <stop offset="0.28" stop-color="#ffdf39" />
      <stop offset="0.72" stop-color="#e6a90c" />
      <stop offset="1" stop-color="#a56600" />
    </radialGradient>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#09050f" flood-opacity="0.48" />
    </filter>
    <filter id="pad-shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#14091f" flood-opacity="0.7" />
    </filter>
    <filter id="lamp-glow" x="-70%" y="-70%" width="240%" height="260%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#5b3500" flood-opacity="0.62" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ffd630" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#shell)" />
  <rect x="118" y="118" width="788" height="788" rx="118" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.72" stroke-width="12" filter="url(#panel-shadow)" />

  <g fill="url(#pad)" stroke="#251239" stroke-width="8" filter="url(#pad-shadow)">
    <rect x="176" y="176" width="112" height="112" rx="24" />
    <rect x="316" y="176" width="112" height="112" rx="24" />
    <rect x="456" y="176" width="112" height="112" rx="24" />
    <rect x="596" y="176" width="112" height="112" rx="24" />
    <rect x="736" y="176" width="112" height="112" rx="24" />
    <rect x="176" y="316" width="112" height="112" rx="24" />
    <rect x="316" y="316" width="112" height="112" rx="24" />
    <rect x="596" y="316" width="112" height="112" rx="24" />
    <rect x="736" y="316" width="112" height="112" rx="24" />
    <rect x="176" y="456" width="112" height="112" rx="24" />
    <rect x="736" y="456" width="112" height="112" rx="24" />
    <rect x="176" y="596" width="112" height="112" rx="24" />
    <rect x="316" y="596" width="112" height="112" rx="24" />
    <rect x="596" y="596" width="112" height="112" rx="24" />
    <rect x="736" y="596" width="112" height="112" rx="24" />
    <rect x="176" y="736" width="112" height="112" rx="24" />
    <rect x="316" y="736" width="112" height="112" rx="24" />
    <rect x="456" y="736" width="112" height="112" rx="24" />
    <rect x="596" y="736" width="112" height="112" rx="24" />
    <rect x="736" y="736" width="112" height="112" rx="24" />
  </g>

  <g fill="url(#lamp)" stroke="#7e5200" stroke-width="8" filter="url(#lamp-glow)">
    <rect x="456" y="316" width="112" height="112" rx="24" />
    <rect x="316" y="456" width="112" height="112" rx="24" />
    <rect x="456" y="456" width="112" height="112" rx="24" />
    <rect x="596" y="456" width="112" height="112" rx="24" />
    <rect x="456" y="596" width="112" height="112" rx="24" />
  </g>
</svg>
